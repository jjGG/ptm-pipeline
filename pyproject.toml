[project]
name = "ptm-pipeline"
version = "0.3.0"
description = "Deploy phosphoproteomics PTM analysis pipeline to new projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Witold Wolski" }
]
dependencies = [
    "cyclopts>=3.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "kinase-library @ git+https://github.com/wolski/kinase-library",
]

[project.optional-dependencies]
dev = [
    "openpyxl>=3.1",
    "pyarrow>=14.0",
]

[dependency-groups]
docs = [
    "mkdocs-material>=9.7,<10",
]

[project.urls]
Homepage = "https://github.com/wolski/ptm-pipeline"
Repository = "https://github.com/wolski/ptm-pipeline"

[project.scripts]
ptm-pipeline = "ptm_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ptm_pipeline"]

[tool.hatch.build.targets.wheel.shared-data]
"template" = "share/ptm-pipeline/template"
